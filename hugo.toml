baseURL = "https://dlatreyte.github.io/"
title = "Physique, Chimie et Informatique"
locale = "fr-FR"
defaultContentLanguage = "fr"
theme = "hugo-theme-relearn"
enableEmoji = true

[outputs]
  home = ["html", "rss", "print"]
  section = ["html", "rss", "print"]
  page = ["html", "rss", "print"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      definitionList = true
      footnote = true
      linkify = true
      strikethrough = true
      table = true
      taskList = true
      typographer = true
      # Les formules $…$, $$…$$, \(…\) et \[…\] sont transmises telles quelles à KaTeX
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [["\\[", "\\]"], ["$$", "$$"]]
          inline = [["\\(", "\\)"], ["$", "$"]]
    [markup.goldmark.parser]
      autoHeadingID = true
      autoHeadingIDType = "github"
      [markup.goldmark.parser.attribute]
        block = true
        title = true
  [markup.highlight]
    noClasses = false
    guessSyntax = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[params]
  # Variantes de couleurs proposées au lecteur (la première est celle par défaut ;
  # les variantes "auto" suivent le réglage clair/sombre du système)
  themeVariant = [
    { identifier = "zen-auto", name = "Zen clair/sombre", auto = ["zen-light", "zen-dark"] },
    { identifier = "relearn-auto", name = "Relearn clair/sombre", auto = [] },
    { identifier = "zen-light" },
    { identifier = "zen-dark" },
    { identifier = "relearn-light" },
    { identifier = "relearn-dark" },
  ]
  # Menu latéral repliable, sections fermées par défaut sauf celle de la page courante
  collapsibleMenu = true
  alwaysopen = false
  showVisitedLinks = true
  disableLandingPageButton = true
  disableGeneratorVersion = true
  # Les sections masquées du menu (hidden: true) n'apparaissent pas non plus dans la recherche
  disableSearchHiddenPages = true

  # Formules : KaTeX intégré à Hugo, au moment du build (chimie \ce et \pu comprises)
  [params.math.toMath]
    output = "htmlAndMathml"
    strict = "ignore"
    throwOnError = false
    macros = [
      ['\dv', '\frac{\mathrm{d}#1}{\mathrm{d}#2}'],
      ['\pdv', '\frac{\partial #1}{\partial #2}'],
      ['\abs', '\left\vert #1 \right\vert'],
      ['\norm', '\left\Vert #1 \right\Vert'],
    ]

  # Titres par défaut des encadrés {{< note >}} (style du paquet Typst gentle-clues),
  # utilisés quand l'encadré n'a pas de titre
  [params.clues.titres]
    abstract = "Résumé"
    info = "Info"
    question = "Question"
    memo = "À retenir"
    task = "Exercice"
    conclusion = "Conclusion"
    tip = "Conseil"
    success = "À retenir"
    warning = "Avertissement"
    error = "Erreur"
    example = "Exemple"
    goal = "Objectif"
    idea = "Idée"
    experiment = "Expérience"
    notify = "Notification"
    code = "Code"
    danger = "Danger"

# Liens en bas du menu latéral
[[menu.shortcuts]]
  name = "<i class='fas fa-fw fa-tags'></i> Mots-clés"
  pageRef = "/tags"
  weight = 10
[[menu.shortcuts]]
  name = "<i class='fas fa-fw fa-list'></i> Catégories"
  pageRef = "/categories"
  weight = 20
[[menu.shortcuts]]
  name = "<i class='fab fa-fw fa-github'></i> GitHub"
  url = "https://github.com/DLatreyte"
  weight = 30
