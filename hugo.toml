baseURL = "https://dlatreyte.github.io/"
defaultContentLanguage = "fr"
title = "Accueil"
theme = "beautifulhugo"

[markup]
  defaultMarkdownHandler = "goldmark"
  [markup.goldmark]
    [markup.goldmark.extensions]
      definitionList = true
      footnote = true
      linkify = true
      strikethrough = true
      table = true
      taskList = true
      typographer = true
    [markup.goldmark.parser]
      autoHeadingID = true
      autoHeadingIDType = "github"
      [markup.goldmark.parser.attribute]
        block = true
        title = true
    [markup.goldmark.renderer]
      hardWraps = false
      unsafe = true
      xhtml = false
  # Coloration syntaxique par classes CSS (feuille css/syntax.css du thème)
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = true
    lineNumbersInTable = true
    lineNoStart = 1
    noClasses = false
    tabWidth = 4
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[params]
  homeTitle = "Physique, Chimie et Informatique"
  subtitle = "Cours de Physique, de Chimie et d'Informatique pour le secondaire"
  mainSections = ["post", "posts"]
  logo = "first_page.jpg"
  favicon = "img/favicon.ico"
  dateFormat = "January 2, 2006"
  commit = false
  rss = true
  comments = true
  readingTime = true
  wordCount = true
  useHLJS = false
  socialShare = true
  delayDisqus = true
  showRelatedPosts = true
  enableEmoji = true

  # Auteur et réseaux affichés dans le pied de page
  [params.author]
    name = "David Latreyte"
    website = "https://dlatreyte.github.io"
    github = "DLatreyte"
    linkedin = "latreyte-david-917852b2"

